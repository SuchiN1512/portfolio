<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="North Star AI vision across two markets and three modalities">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2747c9"/>
      <stop offset="1" stop-color="#7a52c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="270" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 67H480M0 135H480M0 202H480M96 0V270M192 0V270M288 0V270M384 0V270"/>
  </g>
  <!-- orbit arcs -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.18">
    <circle cx="372" cy="86" r="60"/>
    <circle cx="372" cy="86" r="92"/>
  </g>
  <!-- constellation links -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6">
    <line x1="96" y1="196" x2="186" y2="150"/>
    <line x1="186" y1="150" x2="262" y2="198"/>
    <line x1="262" y1="198" x2="372" y2="86"/>
    <line x1="186" y1="150" x2="372" y2="86"/>
  </g>
  <!-- modality nodes -->
  <g font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
    <circle cx="96" cy="196" r="7" fill="#ffffff"/>
    <text x="96" y="224" text-anchor="middle" fill-opacity="0.92">UI</text>
    <circle cx="186" cy="150" r="7" fill="#ffffff"/>
    <text x="186" y="138" text-anchor="middle" fill-opacity="0.92">Voice</text>
    <circle cx="262" cy="198" r="7" fill="#ffffff"/>
    <text x="262" y="226" text-anchor="middle" fill-opacity="0.92">Chat</text>
  </g>
  <!-- north star -->
  <circle cx="372" cy="86" r="34" fill="url(#glow)"/>
  <path d="M372 40 L383 75 L418 86 L383 97 L372 132 L361 97 L326 86 L361 75 Z" fill="#ffffff"/>
  <!-- market pills -->
  <g font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">
    <rect x="28" y="28" width="46" height="24" rx="12" fill="#ffffff" fill-opacity="0.16"/>
    <text x="51" y="44" text-anchor="middle" fill="#ffffff">MX</text>
    <rect x="80" y="28" width="42" height="24" rx="12" fill="#ffffff" fill-opacity="0.16"/>
    <text x="101" y="44" text-anchor="middle" fill="#ffffff">IN</text>
  </g>
  <!-- label -->
  <text x="28" y="250" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#ffffff" fill-opacity="0.85">NORTH STAR AI · 3 MODALITIES</text>
</svg>
