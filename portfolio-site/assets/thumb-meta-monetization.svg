<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Cross-platform monetization concept testing across six journey stages">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a52c9"/>
      <stop offset="1" stop-color="#e8634a"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#bg3)"/>
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 67H480M0 135H480M0 202H480"/>
  </g>
  <!-- tiered pricing bars -->
  <g>
    <rect x="60"  y="150" width="46" height="56" rx="5" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="118" y="118" width="46" height="88" rx="5" fill="#ffffff" fill-opacity="0.62"/>
    <rect x="176" y="86"  width="46" height="120" rx="5" fill="#ffffff"/>
    <g font-family="Inter, Arial, sans-serif" font-weight="800" fill="#7a52c9" text-anchor="middle">
      <text x="199" y="150" font-size="22">$</text>
    </g>
    <g font-family="Inter, Arial, sans-serif" font-weight="800" fill="#ffffff" text-anchor="middle" fill-opacity="0.85">
      <text x="83"  y="186" font-size="16">$</text>
      <text x="141" y="170" font-size="18">$</text>
    </g>
  </g>
  <!-- 6-stage journey -->
  <g>
    <line x1="280" y1="120" x2="430" y2="120" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.6"/>
    <g fill="#ffffff">
      <circle cx="280" cy="120" r="6"/>
      <circle cx="310" cy="120" r="6"/>
      <circle cx="340" cy="120" r="6"/>
      <circle cx="370" cy="120" r="6"/>
      <circle cx="400" cy="120" r="6"/>
      <circle cx="430" cy="120" r="6"/>
    </g>
    <text x="280" y="150" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" fill-opacity="0.9">6 journey stages</text>
  </g>
  <!-- platform chips -->
  <g font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">
    <rect x="28" y="28" width="124" height="24" rx="12" fill="#ffffff" fill-opacity="0.16"/>
    <text x="90" y="44" text-anchor="middle" fill="#ffffff">WhatsApp · Messenger</text>
  </g>
  <text x="28" y="250" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#ffffff" fill-opacity="0.88">MONETIZATION · 2 PLATFORMS</text>
</svg>
